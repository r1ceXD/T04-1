<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f7fb;
      font-family: Arial, sans-serif;
    }

    svg {
      width: min(95vw, 800px);
      height: auto;
      border: 3px solid #2f4858;
      border-radius: 10px;
      box-shadow: 0 5px 14px rgba(47, 72, 88, 0.18);
      background: #bfe8ff;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
    <title id="scene-title">A house and garden scene</title>
    <desc id="scene-desc">A sunny garden with a cloud, tree, fenced house, curved path, and caption.</desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bfe8ff"></rect>
    <rect x="0" y="330" width="800" height="170" fill="#8dcc72"></rect>

    <!-- Sun and cloud -->
    <circle cx="680" cy="85" r="48" fill="#ffd45c" stroke="#e6a82e" stroke-width="4"></circle>
    <ellipse cx="165" cy="105" rx="78" ry="27" fill="#ffffff" opacity="0.9"></ellipse>
    <circle cx="115" cy="103" r="30" fill="#ffffff" opacity="0.9"></circle>
    <circle cx="190" cy="91" r="36" fill="#ffffff" opacity="0.9"></circle>

    <!-- Tree -->
    <rect x="92" y="260" width="30" height="115" fill="#7b4b2a"></rect>
    <circle cx="108" cy="220" r="63" fill="#4e9b51"></circle>
    <circle cx="62" cy="246" r="43" fill="#5eaa56"></circle>
    <circle cx="157" cy="246" r="46" fill="#438b49"></circle>

    <!-- House body, roof, and chimney -->
    <rect x="285" y="245" width="285" height="190" fill="#f4c27a" stroke="#70452e" stroke-width="5"></rect>
    <polygon points="255,250 425,115 600,250" fill="#b65343" stroke="#70452e" stroke-width="5"></polygon>
    <rect x="500" y="155" width="43" height="76" fill="#8d5a43" stroke="#70452e" stroke-width="5"></rect>
    <line x1="493" y1="155" x2="550" y2="155" stroke="#70452e" stroke-width="7"></line>

    <!-- Door and windows -->
    <rect x="390" y="330" width="70" height="105" rx="4" fill="#71472f" stroke="#503020" stroke-width="4"></rect>
    <circle cx="445" cy="384" r="5" fill="#f7d36a"></circle>
    <rect x="315" y="282" width="62" height="56" fill="#a8e2ef" stroke="#70452e" stroke-width="5"></rect>
    <line x1="346" y1="282" x2="346" y2="338" stroke="#70452e" stroke-width="4"></line>
    <line x1="315" y1="310" x2="377" y2="310" stroke="#70452e" stroke-width="4"></line>
    <rect x="483" y="282" width="62" height="56" fill="#a8e2ef" stroke="#70452e" stroke-width="5"></rect>
    <line x1="514" y1="282" x2="514" y2="338" stroke="#70452e" stroke-width="4"></line>
    <line x1="483" y1="310" x2="545" y2="310" stroke="#70452e" stroke-width="4"></line>

    <!-- Fence -->
    <polyline points="20,370 20,315 55,315 55,370 90,370 90,315 125,315 125,370 160,370 160,315 195,315 195,370" fill="none" stroke="#d7a34a" stroke-width="9" stroke-linejoin="round"></polyline>
    <line x1="10" y1="345" x2="205" y2="345" stroke="#a97832" stroke-width="7"></line>

    <!-- Curved garden path -->
    <path d="M 425 435 C 430 455, 520 465, 620 500 L 300 500 C 360 465, 405 450, 425 435 Z" fill="#d8bd8a" stroke="#aa8c5b" stroke-width="3"></path>

    <!-- Flowers -->
    <circle cx="235" cy="410" r="7" fill="#e95c70"></circle>
    <circle cx="250" cy="420" r="7" fill="#f0c64d"></circle>
    <circle cx="265" cy="405" r="7" fill="#a665d1"></circle>
    <line x1="235" y1="417" x2="235" y2="445" stroke="#3e8247" stroke-width="3"></line>
    <line x1="250" y1="427" x2="250" y2="450" stroke="#3e8247" stroke-width="3"></line>
    <line x1="265" y1="412" x2="265" y2="442" stroke="#3e8247" stroke-width="3"></line>

    <text x="400" y="480" text-anchor="middle" fill="#365b38" font-size="22" font-weight="bold">Welcome to our house and garden</text>
  </svg>
</body>
</html>
